# Fork-only evidence gate: fails on a workload change so the failing job log
# carries the destinations. It reads the Runtime Review record and never judges
# the pull request.
# Only additions rooted at Runner.Worker are judged; other roots are logged outside its process tree.
# Acknowledgements count only from maintainers (human OWNER/MEMBER/COLLABORATOR).
name: Garnet evidence check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions: {}

concurrency:
  group: garnet-evidence-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: garnet/evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .garnet
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      # The CLI accepts a record that is still being written as undeterminable
      # and exits 0, so wait for the record on this head to be finalized first.
      - name: Wait for the finalized record on this head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 60); do
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[].body' \
              | grep -F "garnet:summary" | grep -F "\"commit\":\"${HEAD_SHA}\"" | grep -qF '"status":"finalized"'; then
              sleep 30
              exit 0
            fi
            sleep 15
          done
          echo "::error title=garnet/evidence::No finalized Runtime Review record for ${HEAD_SHA} after 15 minutes"
          exit 1
      - name: Check finalized App workload additions
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" |
            jq --arg head "$HEAD_SHA" '
              [add[]
                | select(.user.login == "garnet-runtime-review[bot]" and .user.type == "Bot")
                | select(.body | contains("<!-- garnet-control-plane-pr-comment:v1:app.garnet.ai -->"))
                | select(.body | contains("<!-- garnet:commit " + $head + " -->"))
                | . as $comment
                | (.body | capture("<!-- garnet:summary (?<json>[^\\n]+?) -->").json | fromjson) as $summary
                | select($summary.commit == $head and $summary.status == "finalized")
                | $comment + {summary: $summary}]
              | sort_by(.id) | last // error("No trusted finalized App summary for this head")
            ' > "$RUNNER_TEMP/app-record.json"
          if ! jq -e '.summary | (.added > 0 or .changed > 0)' "$RUNNER_TEMP/app-record.json" > /dev/null; then
            echo 'PASS: finalized App summary reports no workload additions or changed jobs (not a complete-capture claim).'
            exit 0
          fi
          echo 'FAIL: finalized App summary reports workload additions or changed jobs, regardless of capture quality.'
          jq -r '.html_url' "$RUNNER_TEMP/app-record.json"
          jq -r '
            reduce (.body | split("\n")[]) as $line
              ({job: "unknown job", workload: false, diff: false, rows: []};
                if ($line | startswith("<summary><b>")) then
                  .job = ($line | capture("<summary><b>(?<job>.*?)</b>").job)
                elif ($line | startswith("<sub>Workload")) then .workload = true
                elif ($line | startswith("<sub>Runner")) then .workload = false
                elif $line == "```diff" then .diff = true
                elif ($line | startswith("```")) then .diff = false
                elif .workload and .diff and ($line | startswith("+")) then
                  .rows += [{job: .job, line: $line}]
                else . end)
            | .rows[] | [.job, .line] | @tsv
          ' "$RUNNER_TEMP/app-record.json" > "$RUNNER_TEMP/app-additions.tsv"
          : > "$RUNNER_TEMP/app-review.txt"
          while IFS=$'\t' read -r job line; do
            printf '%s: %s\n' "$job" "$line"
            destination=$(printf '%s\n' "$line" | sed -E 's/^\+[ │├└─›]*//; s/ \(.*$//')
            printf -- '- + `%s` — `Runner.Worker` — %s\n' "$destination" "$job" >> "$RUNNER_TEMP/app-review.txt"
          done < "$RUNNER_TEMP/app-additions.tsv"
          bash .garnet/evidence-ack.sh "$RUNNER_TEMP/app-review.txt"
      - name: Runtime Review on the pull request head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          unset GITHUB_STEP_SUMMARY
          set +e
          node .garnet/runtime-review/bin/garnet-runtime-review.js check "$GITHUB_REPOSITORY" "$PR" \
            --wait 900 --fail-on workload-change --annotate | tee "$RUNNER_TEMP/review.txt"
          cli_status=${PIPESTATUS[0]}
          set -e
          if [[ "$cli_status" -eq 0 ]]; then
            exit 0
          fi
          if [[ "$cli_status" -eq 2 ]]; then
            if bash .garnet/evidence-ack.sh "$RUNNER_TEMP/review.txt"; then
              exit 0
            else
              ack_status=$?
              exit "$ack_status"
            fi
          fi
          exit "$cli_status"
