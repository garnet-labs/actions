# Fork-only evidence gate: fails on a workload change so the failing job log
# carries the destinations. It reads the Runtime Review record and never judges
# the pull request.
name: Garnet evidence check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

concurrency:
  group: garnet-evidence-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: garnet/evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .garnet/runtime-review
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      # The CLI accepts a record that is still being written as undeterminable
      # and exits 0, so wait for the record on this head to be finalized first.
      - name: Wait for the finalized record on this head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 60); do
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[].body' \
              | grep -F "garnet:summary" | grep -F "\"commit\":\"${HEAD_SHA}\"" | grep -qF '"status":"finalized"'; then
              sleep 30
              exit 0
            fi
            sleep 15
          done
          echo "::error title=garnet/evidence::No finalized Runtime Review record for ${HEAD_SHA} after 15 minutes"
          exit 1
      - name: Runtime Review on the pull request head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          unset GITHUB_STEP_SUMMARY
          node .garnet/runtime-review/bin/garnet-runtime-review.js check "$GITHUB_REPOSITORY" "$PR" \
            --wait 900 --fail-on workload-change --annotate
