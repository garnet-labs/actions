name: Garnet Runtime Visibility

# Runs the dependency install under the Garnet sensor so the pull request
# carries a head-bound record of what the install actually did at runtime:
# every outbound connection with its execution chain and GitHub step.
on:
  pull_request:
    branches: [main]
  # Records main so pull requests compare with their base, not only their previous push.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: garnet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dep-install:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Garnet Runtime Visibility
        uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          debug: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (lifecycle scripts execute here)
        run: npm ci
      - name: Build
        run: npm run build
